[versions]
# ─── Build Toolchain ──────────────────────────────────────────────────────────
agp                    = "9.0.1"
kotlin                 = "2.3.10"
# KSP 2.3.x decoupled from Kotlin versioning — uses its own semver.
# 2.3.7 targets Kotlin 2.3.x (including 2.3.10).
ksp                    = "2.3.7"

# ─── Android SDK ──────────────────────────────────────────────────────────────
coreKtx                = "1.17.0"
appcompat              = "1.7.1"
material               = "1.13.0"
constraintlayout       = "2.2.1"
coordinatorlayout      = "1.3.0"
recyclerview           = "1.4.0"
viewpager2             = "1.1.0"
preferenceKtx          = "1.2.1"
preferencex            = "1.1.0"

# ─── Jetpack Compose ──────────────────────────────────────────────────────────
compose-bom            = "2026.02.00"
constraintCompose      = "1.1.1"

# ─── Navigation ───────────────────────────────────────────────────────────────
navigation             = "2.9.0"

# ─── Lifecycle ────────────────────────────────────────────────────────────────
lifecycleViewmodelKtx  = "2.10.0"

# ─── Hilt ─────────────────────────────────────────────────────────────────────
# Hilt 2.59+ requires AGP 9.0 and is the first version with AGP 9 support.
hilt                   = "2.59.2"
hiltNavigationCompose  = "1.3.0"

# ─── Coroutines ───────────────────────────────────────────────────────────────
coroutines             = "1.10.2"

# ─── Network & Parsing ────────────────────────────────────────────────────────
okhttp                 = "5.3.2"
gson                   = "2.13.2"
newpipeextractor       = "v0.26.1"
kotlinxSerializationJson = "1.8.1"

# ─── Image Loading ────────────────────────────────────────────────────────────
# Coil 3 is the Compose-first image loader; replaces Glide for Compose screens.
# Glide is kept for legacy XML screens during the incremental migration.
coil                   = "3.2.0"
glide                  = "5.0.5"

# ─── Media & Audio ────────────────────────────────────────────────────────────
paletteKtx             = "1.0.0"
jaudiotaggerAndroid    = "995dd88554"
lottie                 = "6.7.1"

# ─── WorkManager ──────────────────────────────────────────────────────────────
workRuntime            = "2.11.1"

# ─── Legacy XML UI (removed screen-by-screen during migration) ────────────────
calligraphy3           = "3.1.1"
viewpump               = "2.1.1"
roundedimageview       = "2.3.0"
# material-dialogs 3.3.0 — core / input / bottomsheets share the same version
materialDialogs        = "3.3.0"

# ─── Testing ──────────────────────────────────────────────────────────────────
junit                  = "4.13.2"
junitVersion           = "1.3.0"
espressoCore           = "3.7.0"

[libraries]
# ─── AndroidX Core ────────────────────────────────────────────────────────────
core-ktx               = { module = "androidx.core:core-ktx",                          version.ref = "coreKtx" }
appcompat              = { module = "androidx.appcompat:appcompat",                     version.ref = "appcompat" }
material               = { module = "com.google.android.material:material",             version.ref = "material" }
constraintlayout       = { module = "androidx.constraintlayout:constraintlayout",       version.ref = "constraintlayout" }
coordinatorlayout      = { module = "androidx.coordinatorlayout:coordinatorlayout",     version.ref = "coordinatorlayout" }
recyclerview           = { module = "androidx.recyclerview:recyclerview",               version.ref = "recyclerview" }
viewpager2             = { module = "androidx.viewpager2:viewpager2",                   version.ref = "viewpager2" }
preference-ktx         = { module = "androidx.preference:preference-ktx",              version.ref = "preferenceKtx" }
preferencex            = { module = "com.takisoft.preferencex:preferencex",             version.ref = "preferencex" }

# ─── Jetpack Compose (versions come from BOM) ─────────────────────────────────
compose-bom                = { group = "androidx.compose",           name = "compose-bom",             version.ref = "compose-bom" }
compose-ui                 = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics        = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling         = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
# Keep Material 2 alias while legacy XML screens still reference it
compose-material           = { group = "androidx.compose.material",  name = "material" }
compose-icons              = { group = "androidx.compose.material",  name = "material-icons-core" }
compose-icons-extended     = { group = "androidx.compose.material",  name = "material-icons-extended" }
compose-foundation         = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout  = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-animations         = { group = "androidx.compose.animation", name = "animation" }
compose-animations-core    = { group = "androidx.compose.animation", name = "animation-core" }
compose-animations-graphics= { group = "androidx.compose.animation", name = "animation-graphics" }
compose-runtime            = { group = "androidx.compose.runtime",   name = "runtime" }
compose-activity           = { group = "androidx.activity",          name = "activity-compose" }
compose-constraintLayout   = { group = "androidx.constraintlayout",  name = "constraintlayout-compose", version.ref = "constraintCompose" }

# ─── Navigation ───────────────────────────────────────────────────────────────
navigation-compose     = { module = "androidx.navigation:navigation-compose",           version.ref = "navigation" }

# ─── Lifecycle ────────────────────────────────────────────────────────────────
lifecycle-viewmodel-ktx     = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",     version.ref = "lifecycleViewmodelKtx" }
lifecycle-runtime-ktx       = { module = "androidx.lifecycle:lifecycle-runtime-ktx",       version.ref = "lifecycleViewmodelKtx" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelKtx" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycleViewmodelKtx" }

# ─── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android               = { module = "com.google.dagger:hilt-android",               version.ref = "hilt" }
hilt-compiler              = { module = "com.google.dagger:hilt-android-compiler",      version.ref = "hilt" }
hilt-navigation-compose    = { module = "androidx.hilt:hilt-navigation-compose",        version.ref = "hiltNavigationCompose" }

# ─── Coroutines ───────────────────────────────────────────────────────────────
kotlinx-coroutines-core              = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
jetbrains-kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# ─── Network & Parsing ────────────────────────────────────────────────────────
okhttp             = { module = "com.squareup.okhttp3:okhttp",                version.ref = "okhttp" }
gson               = { module = "com.google.code.gson:gson",                  version.ref = "gson" }
newpipeextractor   = { group = "com.github.TeamNewPipe", name = "NewPipeExtractor", version.ref = "newpipeextractor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# ─── Image Loading ────────────────────────────────────────────────────────────
coil-compose       = { module = "io.coil-kt.coil3:coil-compose",             version.ref = "coil" }
coil-network-okhttp= { module = "io.coil-kt.coil3:coil-network-okhttp",      version.ref = "coil" }
# Legacy Glide — kept for XML screens; annotation processor for AppGlideModule
glide              = { module = "com.github.bumptech.glide:glide",            version.ref = "glide" }
glide-compiler     = { module = "com.github.bumptech.glide:compiler",         version.ref = "glide" }

# ─── Media & Audio ────────────────────────────────────────────────────────────
palette-ktx            = { module = "androidx.palette:palette-ktx",           version.ref = "paletteKtx" }
jaudiotagger-android   = { module = "com.github.maxbruecken:jaudiotagger-android", version.ref = "jaudiotaggerAndroid" }
lottie                 = { module = "com.airbnb.android:lottie",              version.ref = "lottie" }
lottie-compose         = { module = "com.airbnb.android:lottie-compose",      version.ref = "lottie" }

# ─── WorkManager ──────────────────────────────────────────────────────────────
work-runtime       = { module = "androidx.work:work-runtime",                 version.ref = "workRuntime" }

# ─── Legacy XML UI ────────────────────────────────────────────────────────────
calligraphy3                  = { module = "io.github.inflationx:calligraphy3",              version.ref = "calligraphy3" }
viewpump                      = { module = "io.github.inflationx:viewpump",                  version.ref = "viewpump" }
roundedimageview              = { module = "com.makeramen:roundedimageview",                 version.ref = "roundedimageview" }
material-dialogs-core         = { module = "com.afollestad.material-dialogs:core",           version.ref = "materialDialogs" }
material-dialogs-input        = { module = "com.afollestad.material-dialogs:input",          version.ref = "materialDialogs" }
material-dialogs-bottomsheets = { module = "com.afollestad.material-dialogs:bottomsheets",   version.ref = "materialDialogs" }

# ─── build-logic internal use only ────────────────────────────────────────────
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle",                    version.ref = "agp" }
kotlin-gradlePlugin  = { group = "org.jetbrains.kotlin",    name = "kotlin-gradle-plugin",      version.ref = "kotlin" }

# ─── Kotlin stdlib (auto-included by KGP; kept for explicit dependency checks) ─
kotlin-stdlib-jdk7 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7",   version.ref = "kotlin" }

# ─── Testing ──────────────────────────────────────────────────────────────────
junit          = { group = "junit",                name = "junit",          version.ref = "junit" }
ext-junit      = { group = "androidx.test.ext",    name = "junit",          version.ref = "junitVersion" }
espresso-core  = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
# ─── Android ──────────────────────────────────────────────────────────────────
androidApplication = { id = "com.android.application",  version.ref = "agp" }
androidLibrary     = { id = "com.android.library",       version.ref = "agp" }
android-test       = { id = "com.android.test",          version.ref = "agp" }

# ─── Kotlin ───────────────────────────────────────────────────────────────────
kotlinAndroid      = { id = "org.jetbrains.kotlin.android",                  version.ref = "kotlin" }
kotlin-jvm         = { id = "org.jetbrains.kotlin.jvm",                      version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
kotlin-parcelize   = { id = "org.jetbrains.kotlin.plugin.parcelize",         version.ref = "kotlin" }
# Compose compiler is a separate KGP plugin since Kotlin 2.0; version = Kotlin version
compose-compiler   = { id = "org.jetbrains.kotlin.plugin.compose",           version.ref = "kotlin" }

# ─── KSP ──────────────────────────────────────────────────────────────────────
ksp                = { id = "com.google.devtools.ksp",                        version.ref = "ksp" }

# ─── Hilt ─────────────────────────────────────────────────────────────────────
hilt               = { id = "com.google.dagger.hilt.android",                 version.ref = "hilt" }
